<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="中国語HSKとスペイン語DELE相当レベルを学べる言語アプリ" />
    <title>言語アプリ</title>
    <link rel="stylesheet" href="portal.css" />
  </head>
  <body>
    <main class="portal">
      <header class="portal-header">
        <a class="portal-brand" href="index.html"><span>言</span><strong>言語アプリ</strong></a>
        <p>LANGUAGE LEARNING</p>
      </header>
      <section class="intro">
        <p class="eyebrow">CHOOSE YOUR LANGUAGE</p>
        <h1>今日は、どの言葉で<br /><em>世界を広げますか？</em></h1>
        <p>単語・発音・クイズ・学習記録を、ひとつの場所で。</p>
      </section>
      <section class="language-grid" aria-label="学習する言語を選ぶ">
        <a class="language-card chinese" href="chinese.html">
          <span class="card-index">01</span><div class="character" aria-hidden="true">你</div>
          <div class="card-copy"><p>MANDARIN CHINESE</p><h2>中国語</h2><span>HSK 1–3級</span><small>600語・例文・聴解・読解・作文・本番模試</small></div>
          <b>中国語を学ぶ <span>→</span></b>
        </a>
        <a class="language-card spanish" href="spanish.html">
          <span class="card-index">02</span><div class="character" aria-hidden="true">Ñ</div>
          <div class="card-copy"><p>ESPAÑOL</p><h2>スペイン語</h2><span>DELE A1–B1相当</span><small>600語・レベル別クイズ・検索・スペイン語音声</small></div>
          <b>スペイン語を学ぶ <span>→</span></b>
        </a>
      </section>
      <footer>学習記録はこのブラウザ内だけに保存されます。</footer>
    </main>
  </body>
</html>
